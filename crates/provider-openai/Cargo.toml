[package]
name = "selection-provider-openai"
version = "0.1.0"
edition = "2021"

[dependencies]
selection-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }
